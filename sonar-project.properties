sonar.projectKey=memoora
sonar.projectName=Memoora
sonar.host.url=http://localhost:9000
sonar.projectVersion=1.0

sonar.sources=app,components,lib,services,context,types
sonar.tests=tests
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.test.jsx,**/*.spec.jsx,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
sonar.exclusions=**/.next/**,**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/public/**,**/prisma/migrations/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
